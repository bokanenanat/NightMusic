<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet">
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href='css/style.css'>
  <title>Night Sound</title>
</head>
<body>
  <canvas id='canvas'></canvas>
  <header class='header-page'>Naight Music</header>
  <img src='images/bird.jpg' class='bird-img'>
  <p class='description-page'>Night Music<br>selection of the Best Persian Rap Tracks</p>

  <!-- ==================== Music -1- ==================== -->
  <h1 class='music-name'>Fasle parvaz</h1>
  <section class='player-music'>
    <audio class='track' id='track-1' src='songs/fasle parvaz.mp3'>
    </audio>
    <button class='btn-play' data-track='track-1'>
      <i class="fa-solid fa-play icon-play"></i>
    </button>
    <div class='audio-bar'>
      <div class='audio-bar-fill' id='audio-bar-fill'></div>
    </div>
    <a class='btn-download' download><i class="fa-solid fa-download download-icon"></i></a>
  </section>
<!-- ==================== Music -2- ==================== -->
  <h1 class='music-name'>tavalod</h1>

      <div class='audio-bar-fill' id='audio-bar-fill'></div>
    </div>
    <a class='btn-download' download><i class="fa-solid fa-download download-icon"></i></a>
  </section>
<!-- ==================== Music -3- ==================== -->

    <div class='audio-bar'>

  </section>
  
  <script src='js/script.js'>
  </script>

</html>
